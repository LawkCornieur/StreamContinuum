name: Promote Beta to Stable

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm promotion of beta to stable release.'
        required: true
        default: 'no'

jobs:
  promote:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy beta to stable
        run: |
          # Remove existing plugin directory content
          rm -rf plugin.video.streamcontinuum/*
          # Copy beta content into stable directory
          cp -a plugin.video.streamcontinuum-beta/. plugin.video.streamcontinuum/

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add plugin.video.streamcontinuum/
          git commit -m "Promote beta to stable release" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push
