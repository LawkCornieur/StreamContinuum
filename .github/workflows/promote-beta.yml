name: Povýšení Beta verze na produkční

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Typ povýšení verze (bump)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      changelog_line1:
        description: 'Záznam do changelogu - řádek 1 (povinný)'
        required: true
        default: 'Opravy a vylepšení.'
      changelog_line2:
        description: 'Záznam do changelogu - řádek 2 (volitelné)'
        required: false
        default: ''
      changelog_line3:
        description: 'Záznam do changelogu - řádek 3 (volitelné)'
        required: false
        default: ''
      changelog_line4:
        description: 'Záznam do changelogu - řádek 4 (volitelné)'
        required: false
        default: ''

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Promote, Bump Version and Write Changelog
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import os
          import sys
          import shutil
          from datetime import datetime

          beta_dir = "plugin.video.streamcontinuum-beta"
          prod_dir = "plugin.video.streamcontinuum"

          # 1. Zjištění základní verze pro navýšení
          # Pokud existuje produkční složka, vezmeme základní verzi z ní.
          # Pokud neexistuje, vezmeme verzi z bety a odečteme z ní 1 patch krok.
          base_version = None
          if os.path.exists(os.path.join(prod_dir, "addon.xml")):
              tree = ET.parse(os.path.join(prod_dir, "addon.xml"))
              base_version = tree.getroot().get("version")
          elif os.path.exists(os.path.join(beta_dir, "addon.xml")):
              tree = ET.parse(os.path.join(beta_dir, "addon.xml"))
              beta_ver = tree.getroot().get("version")
              if beta_ver:
                  b_parts = beta_ver.split(".")
                  if len(b_parts) == 3:
                      b_parts[2] = str(max(0, int(b_parts[2]) - 1))
                      base_version = ".".join(b_parts)

          if not base_version:
              print("Chyba: Nepodařilo se zjistit základní verzi z produkce ani z bety!")
              sys.exit(1)

          # 2. Překopírování bety do produkce
          if os.path.exists(beta_dir):
              print(f"Kopíruji z {beta_dir} do {prod_dir}")
              if os.path.exists(prod_dir):
                  shutil.rmtree(prod_dir)
              shutil.copytree(beta_dir, prod_dir)
              source_dir = prod_dir
          elif os.path.exists(prod_dir):
              print(f"Složka s betou ({beta_dir}) neexistuje, pracuji přímo s produkční složkou ({prod_dir}).")
              source_dir = prod_dir
          else:
              print("Chyba: Nebyla nalezena žádná složka doplňku!")
              sys.exit(1)

          addon_xml = os.path.join(source_dir, "addon.xml")
          if not os.path.exists(addon_xml):
              print("Chyba: addon.xml nenalezen!")
              sys.exit(1)

          # 3. Výpočet nové produkční verze ze základní verze
          parts = base_version.split(".")
          if len(parts) != 3:
              print(f"Chyba: Neplatný formát základní verze: {base_version} (očekáváno X.Y.Z)")
              sys.exit(1)

          bump_type = os.environ.get("INPUT_VERSION_TYPE", "patch")
          if bump_type == "patch":
              parts[2] = str(int(parts[2]) + 1)
          elif bump_type == "minor":
              parts[1] = str(int(parts[1]) + 1)
              parts[2] = "0"
          elif bump_type == "major":
              parts[0] = str(int(parts[0]) + 1)
              parts[1] = "0"
              parts[2] = "0"

          new_version = ".".join(parts)

          tree = ET.parse(addon_xml)
          root = tree.getroot()
          root.set("version", new_version)
          root.set("id", "plugin.video.streamcontinuum")
          root.set("name", "StreamContinuum")

          tree.write(addon_xml, encoding="UTF-8", xml_declaration=True)
          print(f"Úspěšně povýšeno ze základní verze {base_version} na novou produkční verzi {new_version}")

          # 4. Zápis do changelog.txt
          changelog_lines = [
              os.environ.get("INPUT_CHANGELOG_LINE1", "").strip(),
              os.environ.get("INPUT_CHANGELOG_LINE2", "").strip(),
              os.environ.get("INPUT_CHANGELOG_LINE3", "").strip(),
              os.environ.get("INPUT_CHANGELOG_LINE4", "").strip()
          ]
          valid_lines = [line for line in changelog_lines if line]

          if valid_lines:
              changelog_path = os.path.join(source_dir, "changelog.txt")
              existing_changelog = ""
              if os.path.exists(changelog_path):
                  with open(changelog_path, "r", encoding="utf-8") as f:
                      existing_changelog = f.read()

              date_str = datetime.now().strftime("%Y-%m-%d")
              formatted_lines = "\n".join([f"- {line}" for line in valid_lines])
              new_entry = f"[B]Verze {new_version}[/B] - {date_str}\n{formatted_lines}\n\n"

              with open(changelog_path, "w", encoding="utf-8") as f:
                  f.write(new_entry + existing_changelog)

              print("Changelog byl úspěšně aktualizován.")
          else:
              print("Varování: Záznam do changelogu nebyl poskytnut.")

          # 5. Povýšení verze budoucí bety (o jeden patch level výše než nová produkce)
          if os.path.exists(beta_dir) and source_dir != beta_dir:
              # Aktualizace changelogu i v betě
              if valid_lines:
                  beta_changelog_path = os.path.join(beta_dir, "changelog.txt")
                  with open(beta_changelog_path, "w", encoding="utf-8") as f:
                      f.write(new_entry + existing_changelog)

              # Povýšení verze bety
              beta_addon_xml = os.path.join(beta_dir, "addon.xml")
              if os.path.exists(beta_addon_xml):
                  beta_tree = ET.parse(beta_addon_xml)
                  beta_root = beta_tree.getroot()

                  beta_parts = new_version.split(".")
                  beta_parts[2] = str(int(beta_parts[2]) + 1)
                  next_beta_version = ".".join(beta_parts)

                  beta_root.set("id", "plugin.video.streamcontinuum")
                  beta_root.set("name", "StreamContinuum")
                  beta_root.set("version", next_beta_version)
                  beta_tree.write(beta_addon_xml, encoding="UTF-8", xml_declaration=True)
                  print(f"Verze budoucí bety byla povýšena na {next_beta_version}")
          '
        env:
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
          INPUT_CHANGELOG_LINE1: ${{ github.event.inputs.changelog_line1 }}
          INPUT_CHANGELOG_LINE2: ${{ github.event.inputs.changelog_line2 }}
          INPUT_CHANGELOG_LINE3: ${{ github.event.inputs.changelog_line3 }}
          INPUT_CHANGELOG_LINE4: ${{ github.event.inputs.changelog_line4 }}

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add plugin.video.streamcontinuum/ plugin.video.streamcontinuum-beta/ 2>/dev/null || true
          git commit -m "🚀 Promote beta to production (v${{ github.event.inputs.version_type }})" || echo "No changes to commit"
          git push

      - name: Trigger Kodi Repo Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run kodi-repo.yml --ref main
